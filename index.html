<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta http-equiv="Permissions-Policy" content="unload=()" />
    <title>DocMaster — Retrouvez vos documents perdus au Cameroun</title>
    <meta name="description" content="DocMaster est la plateforme communautaire #1 au Cameroun pour retrouver vos documents perdus." />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;600;700;800&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="dm-page-loader" style="position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;background:#F4EFE6;transition:opacity .4s">
      <div style="text-align:center">
        <div style="width:48px;height:48px;margin:0 auto;border:4px solid #EAE3D8;border-top-color:#F5A64B;border-radius:50%;animation:dm-spin 1s linear infinite"></div>
        <p style="margin-top:12px;font-family:Poppins,sans-serif;font-size:13px;color:#8a8075;font-weight:600">DocMaster</p>
      </div>
    </div>
    <style>@keyframes dm-spin{to{transform:rotate(360deg)}}</style>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      window.addEventListener('load', function() {
        var el = document.getElementById('dm-page-loader');
        if (el) { el.style.opacity = '0'; setTimeout(function(){ el.remove(); }, 400); }
      });
    </script>
  </body>
</html>
